<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link type="text/css" rel="styleSheet" href="font.css"/>
    <link type="text/css" rel="styleSheet" href="enemyIndex.css"/>
    <title>template</title>
</head>
<body>
<div id="template">
    {% if data %}
    <div>
        <div style="margin-bottom: 20px">
            通过【<span style="color: #ff6900">{{ data.search }}</span>】搜索到以下敌人单位：
        </div>
        <div class="enemyBox">
            {% for item in data.result %}
            <div class="enemyItem">
                <div class="avatar">
                    <img style="width: 100%" src="{{ item.enemy_icon_path }}" alt="" onerror="this.src='./img/enemy.png'">
                </div>
                <div class="detail">
                    <div>
                        <span class="indexNo">{{ loop.index }}</span>
                        {{ item.info.name }}
                    </div>
                    <div class="tags">
                        <span class="tag {{ item.info.enemyLevel }}">{{ item.info.level_name }}</span>
                        <!--
                        <span class="tag attackType" v-for="n in item.info.attackType.split(' ')">{{ n }}</span>
                        -->
                        <span class="tag enemyIndex">{{ item.info.enemyIndex }}</span>
                    </div>
                    <div class="desc">
                        {{ item.info.description }}
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endif %}
</div>
</body>
</html>
